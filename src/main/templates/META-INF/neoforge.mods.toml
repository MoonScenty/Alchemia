modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MoonScenty"
credits="Aspect icons by Lorc (game-icons.net, CC BY 3.0)"
description='''
An addon for Thaumcraft that gets it running on Minecraft 1.21.1.
Needs the player's own Thaumcraft 4 (1.7.10) and Thaumcraft 5 (1.8.9) jars in the mods folder:
the gameplay follows Thaumcraft 5.2.4, and the pictures, models and sounds are read from the two jars.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="terrablender"
    type="required"
    versionRange="[${terrablender_version},)"
    ordering="AFTER"
    side="BOTH"
